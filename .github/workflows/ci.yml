name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run unit tests when present
        shell: bash
        run: |
          shopt -s nullglob globstar
          tests=(tests/unit/**/*.test.js tests/unit/**/*.test.cjs tests/unit/**/*.test.mjs)
          if [ ${#tests[@]} -gt 0 ]; then
            node --test "${tests[@]}"
          else
            echo "No executable unit tests present; skipping."
          fi
      - name: TypeScript check when configured
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit --pretty false
          else
            echo "No tsconfig.json present; skipping TypeScript check."
          fi
      - name: Check server JavaScript
        shell: bash
        run: |
          set -e
          for f in server/*.js server/routes/*.js; do node --check "$f"; done
