name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run unit tests when present
        shell: bash
        run: |
          if find tests/unit -type f 2>/dev/null | grep -q .; then
            npm test
          else
            echo "No unit tests present; skipping."
          fi
      - run: npx tsc --noEmit --pretty false
      - name: Check server JavaScript
        shell: bash
        run: |
          set -e
          for f in server/*.js server/routes/*.js; do node --check "$f"; done
