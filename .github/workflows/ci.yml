name: CI

on:
  push:
    branches: [main, feature/marketplace-special-order-dispatch]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit --pretty false
      - name: Check server JavaScript
        shell: bash
        run: |
          set -e
          for f in server/*.js server/routes/*.js; do node --check "$f"; done
